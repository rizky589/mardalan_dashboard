<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tracking Petugas Survey</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.2em;
        }

        .header p {
            text-align: center;
            color: #7f8c8d;
            font-size: 1.1em;
        }

        .controls {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .control-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            min-width: 150px;
        }

        .control-group label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .control-group select,
        .control-group input {
            padding: 10px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .control-group select:focus,
        .control-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-card .icon {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #3498db;
        }

        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: #7f8c8d;
            font-size: 0.9em;
            font-weight: 600;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        .map-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        #map {
            height: 600px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .panel h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .officer-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .officer-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .officer-item:hover {
            background: #f8f9fa;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-active {
            background: #27ae60;
            box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.3);
        }

        .status-inactive {
            background: #95a5a6;
        }

        .officer-info {
            flex: 1;
        }

        .officer-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.9em;
        }

        .officer-location {
            color: #7f8c8d;
            font-size: 0.8em;
        }

        @media (max-width: 768px) {
            .stats {
                grid-template-columns: repeat(4, 1fr);
            }
            
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .control-row {
                flex-direction: column;
                align-items: stretch;
            }
        }

        @media (max-width: 480px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ Dashboard Tracking Petugas Survey</h1>
            <p>BPS Kabupaten Labuhanbatu Utara - Real-time Monitoring System</p>
        </div>

        <div class="controls">
            <div class="control-row">
                <div class="control-group">
                    <label for="kecamatanFilter">Kecamatan</label>
                    <select id="kecamatanFilter">
                        <option value="">Semua Kecamatan</option>
                        <option value="Kualuh Hulu">Kualuh Hulu</option>
                        <option value="Kualuh Hilir">Kualuh Hilir</option>
                        <option value="Kualuh Selatan">Kualuh Selatan</option>
                        <option value="Na IX-X">Na IX-X</option>
                        <option value="Marbau">Marbau</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="desaFilter">Desa</label>
                    <select id="desaFilter">
                        <option value="">Semua Desa</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="surveyTypeFilter">Jenis Survey</label>
                    <select id="surveyTypeFilter">
                        <option value="">Semua Jenis</option>
                        <option value="Sensus Penduduk">Sensus Penduduk</option>
                        <option value="Survey Ekonomi">Survey Ekonomi</option>
                        <option value="Survey Kesehatan">Survey Kesehatan</option>
                        <option value="Survey Pendidikan">Survey Pendidikan</option>
                        <option value="Survey Infrastruktur">Survey Infrastruktur</option>
                        <option value="Survey Pertanian">Survey Pertanian</option>
                        <option value="Survey Lingkungan">Survey Lingkungan</option>
                        <option value="Survey Sosial">Survey Sosial</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="dateFrom">Dari Tanggal</label>
                    <input type="date" id="dateFrom">
                </div>

                <div class="control-group">
                    <label for="dateTo">Sampai Tanggal</label>
                    <input type="date" id="dateTo">
                </div>
            </div>
        </div>

        <!-- 8 Statistics Cards -->
        <div class="stats">
            <div class="stat-card">
                <div class="icon">👥</div>
                <div class="number" id="totalOfficers">30</div>
                <div class="label">Total Petugas</div>
            </div>
            <div class="stat-card">
                <div class="icon">🟢</div>
                <div class="number" id="activeOfficers">8</div>
                <div class="label">Petugas Aktif</div>
            </div>
            <div class="stat-card">
                <div class="icon"></div>
                <div class="number" id="totalSurveys">45</div>
                <div class="label">Total Survey</div>
            </div>
            <div class="stat-card">
                <div class="icon">✅</div>
                <div class="number" id="completedSurveys">32</div>
                <div class="label">Survey Selesai</div>
            </div>
            <div class="stat-card">
                <div class="icon">⏳</div>
                <div class="number" id="ongoingSurveys">13</div>
                <div class="label">Survey Berlangsung</div>
            </div>
            <div class="stat-card">
                <div class="icon">📍</div>
                <div class="number" id="trackingPoints">1,250</div>
                <div class="label">Titik Tracking</div>
            </div>
            <div class="stat-card">
                <div class="icon">🗺️</div>
                <div class="number" id="coverageArea">5</div>
                <div class="label">Area Coverage</div>
            </div>
            <div class="stat-card">
                <div class="icon">📋</div>
                <div class="number" id="surveyTypes">6</div>
                <div class="label">Jenis Survey</div>
            </div>
        </div>

        <div class="main-content">
            <div class="map-container">
                <div id="map"></div>
            </div>

            <div class="sidebar">
                <div class="panel">
                    <h3><i class="fas fa-users"></i> Petugas Aktif</h3>
                    <div class="officer-list" id="officerList">
                        <!-- Dynamic content will be loaded here -->
                    </div>
                </div>

                <div class="panel">
                    <h3><i class="fas fa-chart-line"></i> Survey Terbaru</h3>
                    <div id="recentSurveys">
                        <!-- Dynamic content will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map
        let map = L.map('map').setView([2.3274, 99.8492], 12);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Kecamatan data with desa
        const kecamatanData = {
            "Kualuh Hulu": ["Aek Nabara", "Aek Raso", "Bandar Tinggi", "Kualuh Hulu", "Sei Silau"],
            "Kualuh Hilir": ["Sei Balai", "Tanjung Medan", "Ujung Bandar", "Kualuh Hilir", "Sei Jawi"],
            "Kualuh Selatan": ["Simpang Empat", "Sei Merdeka", "Tanjung Harapan", "Kualuh Selatan", "Bandar Jaya"],
            "Na IX-X": ["Na IX", "Na X", "Sei Bamban", "Tanjung Pasir", "Ujung Padang"],
            "Marbau": ["Marbau", "Sei Kepayang", "Tanjung Garbus", "Bandar Khalifah", "Sei Tampang"]
        };

        // Update desa dropdown when kecamatan changes
        document.getElementById('kecamatanFilter').addEventListener('change', function() {
            const kecamatan = this.value;
            const desaSelect = document.getElementById('desaFilter');
            
            // Clear existing options
            desaSelect.innerHTML = '<option value="">Semua Desa</option>';
            
            if (kecamatan && kecamatanData[kecamatan]) {
                kecamatanData[kecamatan].forEach(desa => {
                    const option = document.createElement('option');
                    option.value = desa;
                    option.textContent = desa;
                    desaSelect.appendChild(option);
                });
            }
        });

        // Load demo officer data
        function loadOfficerList() {
            const officerList = document.getElementById('officerList');
            const activeOfficers = [
                { id: 'PET001', name: 'Petugas Survey 1', location: 'Kualuh Hulu', active: true },
                { id: 'PET003', name: 'Petugas Survey 3', location: 'Kualuh Hilir', active: true },
                { id: 'PET005', name: 'Petugas Survey 5', location: 'Kualuh Selatan', active: true },
                { id: 'PET007', name: 'Petugas Survey 7', location: 'Na IX-X', active: true },
                { id: 'PET009', name: 'Petugas Survey 9', location: 'Marbau', active: true },
                { id: 'PET011', name: 'Petugas Survey 11', location: 'Kualuh Hulu', active: false },
                { id: 'PET013', name: 'Petugas Survey 13', location: 'Kualuh Hilir', active: false },
                { id: 'PET015', name: 'Petugas Survey 15', location: 'Marbau', active: true }
            ];

            officerList.innerHTML = activeOfficers.map(officer => `
                <div class="officer-item">
                    <div class="status-indicator ${officer.active ? 'status-active' : 'status-inactive'}"></div>
                    <div class="officer-info">
                        <div class="officer-name">${officer.name}</div>
                        <div class="officer-location">${officer.location}</div>
                    </div>
                </div>
            `).join('');
        }

        // Add demo markers to map
        function addDemoMarkers() {
            const locations = [
                { lat: 2.3274, lng: 99.8492, name: 'PET001 - Kualuh Hulu' },
                { lat: 2.2850, lng: 99.8200, name: 'PET003 - Kualuh Hilir' },
                { lat: 2.2500, lng: 99.8800, name: 'PET005 - Kualuh Selatan' },
                { lat: 2.3800, lng: 99.9200, name: 'PET007 - Na IX-X' },
                { lat: 2.4200, lng: 99.8800, name: 'PET009 - Marbau' }
            ];

            locations.forEach(loc => {
                L.marker([loc.lat, loc.lng])
                    .addTo(map)
                    .bindPopup(`<b>${loc.name}</b><br>Status: Aktif Survey`);
            });
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            loadOfficerList();
            addDemoMarkers();
            
            // Set today's date
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dateFrom').value = today;
            document.getElementById('dateTo').value = today;
        });
    </script>
</body>
</html>
